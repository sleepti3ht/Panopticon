[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panopticon-mcp"
version = "0.1.0"
description = "MCP server for CVE intelligence: local SQLite cache, live NVD fallback, CISA KEV flags"
readme = "panopticon_mcp/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer; pin v1 API for 0.1.0
    "mcp>=1.2.0,<2",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["mcp[cli]>=1.2.0,<2", "ruff>=0.7", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
panopticon-mcp = "panopticon_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["panopticon_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
